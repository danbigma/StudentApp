###########################
# Default Application Config
###########################

# Admin credentials (override with env ADMIN_USER / ADMIN_PASSWORD or -Dadmin.user)
admin.user=admin
admin.password=admin

# Session timeouts
session.timeout.short.seconds=60
session.timeout.long.seconds=1800

# CORS configuration
cors.enabled=false
cors.allowed.origins=*
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=Origin,Content-Type,Accept,Authorization,X-Requested-With
cors.allow.credentials=true
cors.max.age.seconds=1800

# Security headers
security.headers.enabled=true
security.csp=default-src 'self'; script-src 'self' https://code.jquery.com https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://cdn.datatables.net https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://maxcdn.bootstrapcdn.com https://cdn.datatables.net https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'
security.frame.options=SAMEORIGIN
security.referrer.policy=no-referrer

# CSRF & Login protections
csrf.enabled=true
login.max.attempts=5
login.lockout.seconds=600

# Cookies
cookie.force.secure=false

# DB advanced options
db.retry.enabled=true
db.retry.maxAttempts=3
db.retry.backoff.ms=200
